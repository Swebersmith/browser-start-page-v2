<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小新风快捷首页</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="paper-grain" aria-hidden="true"></div>
    <div class="doodle-layer" aria-hidden="true">
      <span class="doodle doodle-star">星星</span>
      <span class="doodle doodle-swirl"></span>
      <span class="doodle doodle-pencil"></span>
      <span class="doodle doodle-badge">Action</span>
    </div>
    <button id="darkToggleButton" class="dark-toggle" type="button" aria-label="切换暗色模式" title="切换暗色模式">暗</button>

    <main class="shell">
      <section class="topbar hero-strip" aria-label="今日状态">
        <img class="hero-strip-main" src="./assets/custom/shin-surprise.jpg" alt="蜡笔小新惊喜表情" />
        <div class="hero-strip-copy">
          <p class="eyebrow" id="dateText">今天</p>
          <strong>今天想去哪？</strong>
          <span>先搜，或者直接点下面的快捷方式。</span>
        </div>
        <img class="hero-strip-side" src="./assets/custom/kasukabe-sky.jpg" alt="春日部防卫队在草地上" />
      </section>

      <section class="search-zone" aria-label="主搜索">
        <form id="searchForm" class="search-form">
          <div class="engine-select">
            <span id="engineSelectLabel" class="sr-only">选择搜索引擎</span>
            <select id="engineSelect" aria-hidden="true" tabindex="-1"></select>
            <button
              id="engineSelectButton"
              class="engine-select-button"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-labelledby="engineSelectLabel engineSelectedName"
            >
              <span id="engineSelectedMark" class="engine-mark">G</span>
              <span class="engine-selected-copy">
                <strong id="engineSelectedName">Google</strong>
                <small>搜索引擎</small>
              </span>
              <span class="engine-chevron" aria-hidden="true"></span>
            </button>
            <div id="engineMenu" class="engine-menu" role="listbox" aria-labelledby="engineSelectLabel"></div>
          </div>
          <div class="search-input-wrap">
            <span class="sr-only">搜索内容或网址</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input
              id="searchInput"
              type="text"
              aria-label="Search"
              autocomplete="off"
              placeholder="搜索，或者输入网址直接打开"
              autofocus
            />
            <div class="search-history" id="searchHistory" hidden></div>
          </div>
          <button class="search-button" type="submit">出发</button>
        </form>
        <div class="quick-engines" id="engineButtons" aria-label="搜索引擎快捷切换"></div>
      </section>

      <section class="ai-console" aria-label="AI 控制台">
        <div class="ai-console-head">
          <div>
            <p>AI Console</p>
            <h2>Agent 控制台</h2>
          </div>
          <span class="ai-status-pill" id="aiStatusPill" data-tone="idle">未连接</span>
        </div>

        <div class="ai-provider-grid" id="aiProviderCards" aria-label="AI 通道"></div>

        <div class="ai-message-list" id="aiMessages" aria-live="polite"></div>

        <div class="ai-quick-actions" aria-label="AI 快捷指令">
          <button type="button" data-prompt="分析这个网页项目当前还能怎么优化">分析项目</button>
          <button type="button" data-prompt="检查本机 Agent 是否在线，并总结可用能力">检查 Agent</button>
          <button type="button" data-prompt="帮我规划下一次部署前需要验证的事项">部署检查</button>
        </div>

        <form class="ai-chat-form" id="aiChatForm">
          <textarea id="aiChatInput" rows="3" maxlength="1200" placeholder="输入要交给 AI 或本机 Agent 的任务"></textarea>
          <div class="ai-chat-actions">
            <button type="button" id="aiConnectButton">连接测试</button>
            <button type="button" id="aiSettingsButton">设置</button>
            <button type="submit" class="primary-button">发送</button>
          </div>
        </form>
      </section>

      <section class="toolbar" aria-label="快捷方式工具">
        <div class="tabs" id="categoryTabs"></div>
        <div class="actions">
          <button type="button" id="addShortcutButton">
            <span>+</span>
            添加
          </button>
          <button type="button" id="exportButton">导出</button>
          <label class="import-button">
            导入
            <input id="importInput" type="file" accept="application/json" />
          </label>
        </div>
      </section>

      <section class="shortcut-grid" id="shortcutGrid" aria-label="快捷方式"></section>

      <section class="sync-panel" aria-label="多设备同步">
        <label>
          <span>同步码</span>
          <input id="syncKeyInput" type="password" autocomplete="off" maxlength="80" placeholder="输入同一个同步码" />
        </label>
        <button type="button" id="syncEnableButton">启用同步</button>
        <button type="button" id="syncPullButton">拉取云端</button>
        <p id="syncStatus">未启用同步，本机数据只保存在当前浏览器。</p>
      </section>

      <section class="character-stage weather-stage" aria-label="天气和时间">
        <div class="stage-copy weather-time-card">
          <p>Today</p>
          <h2 id="stageTimeText">--:--</h2>
          <span id="stageDateText">正在准备今天</span>
        </div>
        <div class="weather-panel">
          <div class="weather-icon" id="weatherIcon" aria-hidden="true">?</div>
          <div>
            <p class="weather-kicker">当前天气</p>
            <strong id="weatherTemp">定位后显示</strong>
            <small class="weather-location" id="weatherLocation">等待位置</small>
            <span id="weatherDesc">允许定位后，小新帮你看天气。</span>
          </div>
          <button id="weatherRefreshButton" class="weather-refresh" type="button">刷新</button>
        </div>
        <div class="today-history-panel" aria-label="历史上的今天" tabindex="0">
          <p>历史上的今天</p>
          <strong id="todayHistoryYear">--</strong>
          <span id="todayHistoryText">正在翻小新家的旧相册...</span>
          <div class="today-history-detail" id="todayHistoryDetail" role="tooltip">正在翻小新家的旧相册...</div>
        </div>
      </section>

      <section class="widget-board" aria-label="自定义小组件">
        <div class="section-head">
          <div>
            <p>Widgets</p>
            <h2>我的小组件</h2>
          </div>
          <button type="button" id="addWidgetButton">
            <span>+</span>
            添加组件
          </button>
        </div>
        <div class="widget-grid" id="widgetGrid"></div>
      </section>
    </main>

    <dialog id="shortcutDialog">
      <form method="dialog" class="dialog-card" id="shortcutForm">
        <div class="dialog-head">
          <h2 id="dialogTitle">添加快捷方式</h2>
          <button class="icon-button" type="button" id="closeDialogButton" aria-label="关闭">×</button>
        </div>
        <label>
          网址
          <span class="url-line">
            <input id="shortcutUrl" type="text" inputmode="url" required placeholder="example.com 或 https://example.com" />
            <button id="metadataButton" type="button">识别</button>
          </span>
          <small id="shortcutMetaStatus" class="shortcut-meta-status" aria-live="polite"></small>
        </label>
        <label>
          名称
          <input id="shortcutName" type="text" required maxlength="24" placeholder="自动从网址识别，可手动修改" />
        </label>
        <label>
          分组
          <input id="shortcutCategory" type="text" required maxlength="16" list="categorySuggestions" placeholder="例如：常用" />
          <datalist id="categorySuggestions"></datalist>
        </label>
        <label>
          颜色
          <span class="color-line">
            <input id="shortcutColor" type="color" value="#e8442e" />
            <button id="autoColorButton" type="button">自动配色</button>
          </span>
        </label>
        <div class="dialog-actions">
          <button type="button" id="deleteShortcutButton" class="danger-button">删除</button>
          <span></span>
          <button type="button" id="cancelDialogButton">取消</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="widgetDialog">
      <form method="dialog" class="dialog-card" id="widgetForm">
        <div class="dialog-head">
          <h2 id="widgetDialogTitle">添加小组件</h2>
          <button class="icon-button" type="button" id="closeWidgetDialogButton" aria-label="关闭">×</button>
        </div>
        <label>
          标题
          <input id="widgetTitle" type="text" required maxlength="24" placeholder="例如：今日计划" />
        </label>
        <label>
          类型
          <select id="widgetType">
            <option value="note">便签</option>
            <option value="countdown">倒计时</option>
            <option value="link">链接</option>
          </select>
        </label>
        <label>
          内容
          <textarea id="widgetContent" required maxlength="160" placeholder="便签文字、日期 2026-12-31，或链接地址"></textarea>
        </label>
        <label>
          颜色
          <input id="widgetColor" type="color" value="#2775d1" />
        </label>
        <div class="dialog-actions">
          <button type="button" id="deleteWidgetButton" class="danger-button">删除</button>
          <span></span>
          <button type="button" id="cancelWidgetDialogButton">取消</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="aiSettingsDialog">
      <form method="dialog" class="dialog-card ai-settings-card" id="aiSettingsForm">
        <div class="dialog-head">
          <h2>AI 接入设置</h2>
          <button class="icon-button" type="button" id="closeAiSettingsButton" aria-label="关闭">×</button>
        </div>
        <label>
          默认通道
          <select id="aiProviderSelect">
            <option value="local">本机 Agent</option>
            <option value="cloud">云端模型</option>
            <option value="custom">自定义接口</option>
          </select>
        </label>
        <label>
          本机 Agent 地址
          <input id="aiLocalUrl" type="url" placeholder="http://127.0.0.1:8765" />
        </label>
        <label>
          DeepSeek 模型名称
          <input id="aiCloudModel" type="text" maxlength="80" placeholder="deepseek-chat 或 deepseek-reasoner" />
        </label>
        <label>
          自定义聊天接口
          <input id="aiCustomEndpoint" type="url" placeholder="https://example.com/api/chat" />
        </label>
        <label>
          权限模式
          <select id="aiPermissionMode">
            <option value="confirm">执行前确认</option>
            <option value="readonly">只读聊天</option>
            <option value="auto">允许自动执行</option>
          </select>
        </label>
        <p class="ai-settings-note">本机 Agent 建议只监听 127.0.0.1，并使用自己的确认机制处理文件、命令和系统操作。</p>
        <div class="dialog-actions">
          <span></span>
          <button type="button" id="cancelAiSettingsButton">取消</button>
          <button type="submit" class="primary-button">保存</button>
        </div>
      </form>
    </dialog>

    <template id="shortcutTemplate">
      <article class="shortcut-card">
        <button class="pin-shortcut" type="button" aria-label="置顶快捷方式"></button>
        <a class="shortcut-link" target="_blank" rel="noreferrer">
          <span class="shortcut-icon"></span>
          <span class="shortcut-meta">
            <strong></strong>
            <small></small>
          </span>
        </a>
        <button class="edit-shortcut" type="button" aria-label="编辑快捷方式">编辑</button>
      </article>
    </template>

    <template id="widgetTemplate">
      <article class="widget-card">
        <div class="widget-ribbon"></div>
        <div>
          <p class="widget-type"></p>
          <h3></h3>
        </div>
        <p class="widget-content"></p>
        <button class="edit-widget" type="button" aria-label="编辑小组件">编辑</button>
      </article>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
